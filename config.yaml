# =====================================================================
# MWS Industrial Intelligence Agent — Configuration
# Implements SOP: "Deploying Industrial Intelligence Agents"
# =====================================================================

# ---------------------------------------------------------------------
# Section 1: Project Scoping and Source Definition
# ---------------------------------------------------------------------
# Each source needs at least one working RSS feed OR a section URL to
# crawl. RSS is strongly preferred (Section 6: avoids paywall/bot-block
# issues). Fill in / correct the URLs below for your actual access —
# placeholders are marked TODO.
sources:
  - name: "Business Standard"
    verticals: ["Companies", "Economy"]
    rss_feeds:
      - "https://www.business-standard.com/rss/companies-101.rss"
      - "https://www.business-standard.com/rss/economy-102.rss"
    section_urls: []
    notes: "Known to have bot-detection / paywall — monitor Source Health (Sec. 6)."

  - name: "Industry Today"
    verticals: ["Manufacturing", "Sustainability"]
    rss_feeds:
      - "https://industrytoday.com/category/manufacturing/feed"
      - "https://industrytoday.com/category/articles/government-legislation/feed"
    section_urls: []
    notes: >
      VERIFIED OUTPUTS XML FILE

  - name: "Indian Infrastructure Research"
    verticals: ["Water", "Power", "Industry"]
    rss_feeds:
      - "https://indianinfrastructure.com/category/water-waste/feed"
      - "https://indianinfrastructure.com/category/power/feed"
    section_urls: []
    notes: >
      RSS feed found 2026-08-17 (site-wide feed, not vertical-specific —
      covers all categories, not just water/power). Switched from
      section-page crawling to this feed since RSS is more reliable (see
      Section 6 of the SOP). section_urls emptied deliberately: scraper.py
      currently runs rss_feeds AND section_urls unconditionally rather
      than treating RSS as primary-with-fallback, so leaving both
      populated would mean redundant crawling and reintroducing the
      category/archive-page guesswork bugs fixed on 2026-08-16, right
      alongside clean RSS data. If the feed ever breaks, fall back to:
        section_urls:
          - "https://indianinfrastructure.com/category/water/"
          - "https://indianinfrastructure.com/category/power/"
      Since the feed is site-wide, articles outside the Water/Power
      verticals will also come through; the classification matrix
      pre-filter (Section 4) should still exclude anything irrelevant.

  - name: "CPCB Public Notices"
    verticals: ["Compliance Notices"]
    rss_feeds: []
    section_urls:
      - "https://cpcb.nic.in/public-notice/"
    optional: true
    notes: >
      cpcb.nic.in has an expired/invalid SSL certificate (site-side issue,
      logged as a known condition rather than a scraper bug — see
      scraper.py::_record_failure). The alternate domain cpcb.gov.in was
      investigated as a replacement (2026-08-16) but rejected: its
      robots.txt disallows automated access, and the specific page found
      ("All EPR Portals of CPCB") is a portal directory, not a notices/news
      feed, so it wouldn't have produced usable article data anyway. No
      working automatable source for CPCB notices has been found yet.
      Left enabled (as optional) in case cpcb.nic.in's certificate gets
      fixed on their end — until then this source will just be skipped
      and logged.

  - name: "NGT Portal (via Indian Kanoon)"
    verticals: ["Judgments", "Orders"]
    rss_feeds:
      - "https://indiankanoon.org/feeds/latest/judgments/"
    section_urls: []
    optional: true
    notes: >
      Switched from greentribunal.gov.in (2026-08-17): that site is a
      static government portal with no structured article/notice feed —
      not a workable automated source. Indian Kanoon suggested as a
      replacement, but IMPORTANT — the URL above is their SITE-WIDE
      "latest judgments" feed covering every Indian court, not NGT
      specifically. It will need heavy reliance on the keyword pre-filter
      (Section 4) and classification matrix to surface only NGT-relevant
      items, and will likely include a lot of noise from unrelated courts.
      RECOMMENDED FIX: Indian Kanoon supports building a scoped RSS/alert
      feed around a specific search query (their site shows "Create
      Alert — Get alerts for new judgments matching this query" on
      search results, e.g. searching 'National Green Tribunal
      doctypes:judgments'). Visit indiankanoon.org, run that search, and
      look for a feed/alert link scoped to it — swap that URL in here in
      place of the site-wide one above once found. Left optional since
      even the general feed's relevance to NGT specifically is unverified.

# ---------------------------------------------------------------------
# Section 2: Agentic Scraping Workflow parameters
# ---------------------------------------------------------------------
crawl:
  frequency: "daily"          # SOP: Monday 08:00 IST
  schedule_cron: "30 2 * * *"   # cron syntax, IST — see scheduler.py
  lookback_days: 1            # "review the scraped text from the last 7 days"
  parsing_depth: 2             # Home page -> Article page (full text, not just headlines)
  max_articles_per_source: 40
  request_timeout_seconds: 20
  request_delay_seconds: 1.5   # politeness delay between requests
  user_agent: "Mozilla/5.0 (compatible; MWS-IntelAgent/1.0; +contact-your-admin)"

# ---------------------------------------------------------------------
# Section 3: Use Case Classification Matrix
# ---------------------------------------------------------------------
system_prompt: >
  You are an Industrial Business Intelligence Analyst. Your task is to
  review the scraped text from the last 14 days and identify specific
  business use cases. For each relevant article, extract: Company Name,
  Sector, Location (if mentioned), and the specific 'Pain Point' or
  'Opportunity' identified. Classify each finding into exactly one of
  the categories in the classification matrix provided. If an article
  is generic economic/business news with no specific actionable
  company-level signal, mark it as NOT RELEVANT and exclude it from
  the final output.

classification_matrix:
  - category: "Environmental Compliance"
    keywords: ["CPCB", "NGT", "penalty", "ETP", "groundwater", "violation",
               "Effluent Treatment", "Groundwater Illegal", "Compliance Failure"]
    logic: >
      Focus on manufacturing units failing discharge norms or illegal
      water extraction.
    severity_note: "Treat confirmed penalties/fines as CRITICAL for alerting (Section 5)."

  - category: "Water Scarcity"
    keywords: ["Water stress", "seasonal shortage", "drought", "intake limit",
               "Water Shortage", "Zero Liquid Discharge", "Surface Water Intake"]
    logic: >
      Look for industries reporting production cuts due to seasonal
      water unavailability.

  - category: "Rapid Expansion"
    keywords: ["Datacenter", "microelectronics", "ramp-up",
               "Cleanroom", "Fast-track Project", "Hyperscale"]
    logic: >
      Identify projects with 'stringent' or 'aggressive' execution
      timelines. IMPORTANT — only classify as "Rapid Expansion" if the
      article ALSO mentions a water-related angle (e.g. water supply,
      water intake, ETP/effluent treatment, demin/ultrapure water
      requirements, water infrastructure for the project). A
      capacity/expansion announcement with no water angle at all is
      generic business news, not a Rapid Expansion finding for this
      matrix — mark it NOT RELEVANT instead, even if it uses words like
      "capacity expansion" or "semiconductor". This pairing requirement
      exists specifically to cut down false positives from ordinary
      expansion news that has nothing to do with water/industrial
      utilities.

  - category: "Monetary Loss"
    keywords: ["Delayed commissioning", "maintenance cost", "revenue loss",
               "Revenue Leakage", "Idle Capacity", "O&M Overrun", "Delayed Start"]
    logic: >
      Focus on utilities or industries facing heavy penalties for
      project delays.

  - category: "Ultrapure Quality"
    keywords: ["Demin water quality", "Boiler Feed Quality",
               "Cooling tower Feed Quality", "Ultrapure water quality",
               "Chip fabrication", "Assembly and testing"]
    logic: >
      Focus on industry with extremely pure or high quality standard
      requirement such as Semiconductor chip-based Microelectronics
      Industry.

  - category: "Deferment of Capital Costs"
    keywords: ["Rental model", "bridge contracts", "BOO contracts",
               "plug-and-play rental assets", "Emergency contracts",
               "Long term Service Agreement"]
    logic: >
      Focus on industry with paying capacity but who look to defer on
      capital payments and prefer rental assets that can be quickly
      deployed and decommissioned with limited ownership prospects.
      IMPORTANT — only classify as "Deferment of Capital Costs" if the
      article ALSO involves a water-related asset or service (e.g.
      rental water treatment plants, temporary ETP/RO/demin skids,
      water infrastructure leasing) — not generic equipment rental or
      financing deals with no water angle. This pairing requirement
      exists specifically to cut down false positives from unrelated
      rental/financing news.

# ---------------------------------------------------------------------
# Section 4: Semantic search keyword lists (used as retrieval hints /
# pre-filter before the LLM classification pass)
# ---------------------------------------------------------------------
semantic_keyword_lists:
  a: ["CPCB", "NGT", "Effluent Treatment", "Groundwater Illegal", "Compliance Failure"]
  b: ["Water Shortage", "Zero Liquid Discharge", "Surface Water Intake"]
  c: ["Capacity Expansion", "Cleanroom", "Fast-track Project", "Hyperscale"]
  d: ["Revenue Leakage", "Idle Capacity", "O&M Overrun", "Delayed Start"]

# ---------------------------------------------------------------------
# Section 5: Output and Notification Integration
# ---------------------------------------------------------------------
output:
  format: "markdown_table"          # "markdown_table" or "csv" or "both"
  output_dir: "output"
  filename_pattern: "weekly_intel_{date}.md"

delivery:
  email:
    enabled: false               # set true and fill in SMTP + recipients to activate
    smtp_host: "TODO"
    smtp_port: 587
    smtp_user: "TODO"
    smtp_password_env_var: "MWS_SMTP_PASSWORD"   # read from environment, never hardcode
    recipients:
      - "TODO: person@company.com"
    subject_pattern: "MWS Weekly Industrial Intelligence — {date}"

  drive:
    enabled: false               # requires Google Drive API credentials
    folder_id: "TODO"

  slack:
    enabled: false
    webhook_url_env_var: "MWS_SLACK_WEBHOOK_URL"
    alert_on_categories: ["Environmental Compliance"]
    alert_only_if: "critical"    # per SOP: "Post a high-level alert for any 'Critical' compliance penalties"

# ---------------------------------------------------------------------
# Section 6: Review and Refinement
# ---------------------------------------------------------------------
review:
  log_false_positive_candidates: true
  log_source_failures: true
